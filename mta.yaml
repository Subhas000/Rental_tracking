_schema-version: "3.3"

ID: rental
version: 1.0.0
description: "Rental Equipment Tracking Cloud Application"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

        - rm -rf app/router/public
        - mkdir -p app/router/public

        - cp app/index.html app/router/public/index.html

        - mkdir -p app/router/public/project2
        - cp -r app/project2/webapp/. app/router/public/project2/

        - mkdir -p app/router/public/project10
        - cp -r app/project10/webapp/. app/router/public/project10/

        - mkdir -p app/router/public/project11
        - cp -r app/project11/webapp/. app/router/public/project11/

        - mkdir -p app/router/public/project12
        - cp -r app/project12/webapp/. app/router/public/project12/

        - mkdir -p app/router/public/project13
        - cp -r app/project13/webapp/. app/router/public/project13/

modules:

  - name: rental-router
    type: approuter.nodejs
    path: app/router

    parameters:
      memory: 128M
      disk-quota: 256M

    requires:
      - name: rental-auth

      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: rental-srv
    type: nodejs
    path: gen/srv

    parameters:
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack

    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

    requires:
      - name: rental-auth
      - name: rental-db

  - name: rental-db-deployer
    type: hdb
    path: gen/db

    requires:
      - name: rental-db

resources:

  - name: rental-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: rental-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared